<section class="auth-card">
  <h2>Créer un compte</h2>

  @if (error()) {
    <div class="alert-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Nom affiché
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <small class="field-error">Entre 2 et 100 caractères.</small>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Saisissez un email valide.</small>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">8 caractères minimum, avec une majuscule, une minuscule et un chiffre.</small>
      }
    </label>

    <label>
      Confirmer le mot de passe
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && form.hasError('mismatch')) {
        <small class="field-error">Les mots de passe ne correspondent pas.</small>
      }
    </label>

    <button type="submit" class="btn" [disabled]="loading()">
      {{ loading() ? 'Création...' : 'Créer mon compte' }}
    </button>
  </form>

  <p class="alt">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
</section>
